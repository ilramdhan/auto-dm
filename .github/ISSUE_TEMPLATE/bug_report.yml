name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check [docs/troubleshooting.md](https://github.com/ilramdhan/autodm/blob/main/docs/troubleshooting.md) first.

        **Do not paste access tokens, app secrets, `APP_SECRET`, `DATABASE_URL` or full webhook payloads.** Redact them.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and discussions and found no duplicate.
          required: true
        - label: I removed all tokens, secrets and personal data from this report.
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Comment "..." on a post
        3. See error in Activity
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Webhook / Meta
        - Private reply / DM
        - Public reply
        - Dashboard UI
        - Auth
        - Deployment / build
        - n8n
        - Other
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment type
      options:
        - Vercel + Supabase
        - Docker / Docker Compose
        - Local development
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      description: Release tag, Docker image tag (e.g. `0.2.0`, `edge`) or commit SHA.
      placeholder: "0.2.0 or sha-1a2b3c4"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node -v`. Leave empty for Docker images.
      placeholder: v22.11.0
  - type: dropdown
    id: appmode
    attributes:
      label: Meta app mode
      options:
        - Development
        - Live
        - Not applicable
  - type: textarea
    id: logs
    attributes:
      label: Logs / Activity error message (redacted)
      description: Paste relevant log lines or the Activity page error.
      render: shell
