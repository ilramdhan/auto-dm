name: Docker

# Builds the self-hosting image. PRs: build only (no push).
# main: push `edge` + `sha-<short>`. Releases call this workflow with the version (see release.yml).
on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-entrypoint.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "next.config.ts"
      - "scripts/**"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: "Release version without the v prefix, e.g. 1.2.3"
        type: string
        required: true
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}-${{ inputs.version || 'edge' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ inputs.version != '' && !startsWith(inputs.version, '0.') }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=edge,branch=main,enable=${{ inputs.version == '' && github.ref == 'refs/heads/main' }}
            type=sha,format=short,enable=${{ inputs.version == '' && github.ref == 'refs/heads/main' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=auto-reply-ig
            org.opencontainers.image.description=Self-hosted Instagram comment-to-DM automation
            org.opencontainers.image.licenses=MIT

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
