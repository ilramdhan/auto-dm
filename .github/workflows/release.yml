name: Release

# release-please keeps a "chore(main): release x.y.z" PR up to date from Conventional Commits
# (squash-merged PR titles). Merging it bumps package.json, updates CHANGELOG.md, tags vX.Y.Z,
# creates the GitHub Release, and then publishes the Docker image for that version.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # Optional: a fine-grained PAT (contents + pull requests: write) lets CI run on the release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # Pin the base branch so releases never depend on the repo's default-branch setting.
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
